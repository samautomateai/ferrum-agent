name: M2 Bootstrap Format and Lockfile
on:
  push:
    branches: [fix/m2-bootstrap-format-lock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Check compilation
        run: cargo check --locked --all-targets
      - name: Run tests
        run: cargo test --locked --all
