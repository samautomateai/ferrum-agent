name: M2 Bootstrap Format and Lockfile
on:
  push:
    branches: [fix/m2-bootstrap-format-lock]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust source
        run: cargo fmt --all
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit generated changes to fix branch
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs' Cargo.lock
            git commit -m "style: rustfmt and generate Cargo.lock"
            git push origin HEAD:fix/m2-bootstrap-format-lock
          fi
      - name: Check compilation
        run: cargo check --locked --all-targets
      - name: Run tests
        run: cargo test --locked --all
