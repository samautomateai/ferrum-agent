name: PR Autofix and Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  rustfmt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      validated_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting if required
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! git diff --quiet --exit-code; then
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git diff --cached --check
            git commit -m "style(bot): apply rustfmt"
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:$PR_HEAD"
          fi
      - name: Record formatted commit
        id: final
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: rustfmt
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.rustfmt.outputs.validated_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  coverage:
    needs: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.rustfmt.outputs.validated_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: llvm-tools-preview
      # Install from crates.io instead of relying on GitHub Releases (504 errors).
      - name: Cache cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: coverage-llvmcov-0.9.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - name: Test and enforce line coverage >= 90%
        run: cargo llvm-cov --locked --all-features --workspace --all-targets --fail-under-lines 90 --summary-only
      - name: Generate LCOV artifact
        if: always()
        run: cargo llvm-cov --locked --all-features --workspace --all-targets --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-lcov
          path: lcov.info

  quality:
    needs: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.rustfmt.outputs.validated_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy, llvm-tools-preview
      # Install directly from crates.io: GitHub release downloads repeatedly return 504.
      # Cache the resulting binaries for subsequent CI runs.
      - name: Restore Rust quality tools
        id: rust-tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/zizmor
          key: quality-rust-tools-source-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Rust quality tools from crates.io
        if: steps.rust-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-llvm-cov --version 0.9.1
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked zizmor
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Install Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Add Go CLI tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Mandatory quality contract
        run: task quality
  platforms:
    needs: rustfmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.rustfmt.outputs.validated_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release
