name: Linux quality image candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ci-image-publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Resolve Rust base to immutable manifest digest
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base='docker.io/library/rust:1.99.1-bookworm'
          digest="$(docker buildx imagetools inspect "$base" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Could not resolve base digest' >&2; exit 1; }
          echo "image=docker.io/library/rust@${digest}" >> "$GITHUB_OUTPUT"
          echo "Base image: docker.io/library/rust@${digest}" >> "$GITHUB_STEP_SUMMARY"
      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate manifest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ci/images/quality/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/ferrum-quality:trial-${{ github.run_id }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
