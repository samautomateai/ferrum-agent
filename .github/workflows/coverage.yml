name: Coverage gate (90%)
on:
  push:
  pull_request:
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test and enforce line coverage >= 90%
        run: cargo llvm-cov --locked --all-features --workspace --all-targets --fail-under-lines 90 --summary-only
      - name: Generate LCOV artifact
        if: always()
        run: cargo llvm-cov --locked --all-features --workspace --all-targets --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-lcov
          path: lcov.info
