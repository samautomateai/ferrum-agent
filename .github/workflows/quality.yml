name: Mandatory quality gates
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache Rust dependencies and compilation (quality)
        id: rust-build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-
            rust-quality-${{ runner.os }}-${{ runner.arch }}-
      # Install directly from crates.io: GitHub release downloads repeatedly return 504.
      # Cache the resulting binaries for subsequent CI runs.
      - name: Restore Rust quality tools
        id: rust-tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/zizmor
          key: quality-rust-tools-source-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Rust quality tools from crates.io
        if: steps.rust-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-llvm-cov --version 0.9.1
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked zizmor
      - name: Cache Go-based quality tools
        id: go-quality-tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/go/bin
          key: go-quality-tools-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install actionlint
        if: steps.go-quality-tools-cache.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Install Task
        if: steps.go-quality-tools-cache.outputs.cache-hit != 'true'
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Install Gitleaks CLI
        if: steps.go-quality-tools-cache.outputs.cache-hit != 'true'
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Add Go CLI tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cache sccache executable
        id: sccache-bin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/sccache
          key: sccache-0.12.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install sccache
        if: steps.sccache-bin-cache.outputs.cache-hit != 'true'
        run: cargo install --locked sccache --version 0.12.0
      # Persist the local sccache store with actions/cache. The GHA sccache
      # backend requires runtime cache-service variables not exposed here.
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/sccache
          key: sccache-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-
            sccache-coverage-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Enable compiler caching for quality
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=$(command -v sccache)"
            echo "SCCACHE_DIR=$HOME/.cache/sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
          } >> "$GITHUB_ENV"
      - name: Record quality build start
        id: quality-start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Mandatory quality contract
        run: task quality
      - name: Compiler cache statistics (quality)
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            {
              echo '### sccache compiler statistics'
              echo '\`\`\`text'
              sccache --show-stats || true
              echo '\`\`\`'
            } >> "$GITHUB_STEP_SUMMARY"
            sccache --stop-server || true
          fi
      - name: Report cache effectiveness and quality duration
        if: always()
        shell: bash
        env:
          BUILD_CACHE_HIT: ${{ steps.rust-build-cache.outputs.cache-hit }}
          RUST_TOOLS_HIT: ${{ steps.rust-tools-cache.outputs.cache-hit }}
          GO_TOOLS_HIT: ${{ steps.go-quality-tools-cache.outputs.cache-hit }}
          START_EPOCH: ${{ steps.quality-start.outputs.epoch }}
        run: |
          {
            echo '### Quality job cache metrics'
            echo '| Metric | Value |'
            echo '|---|---|'
            echo "| Rust build cache exact hit | ${BUILD_CACHE_HIT:-false} |"
            echo "| Rust quality tools cache hit | ${RUST_TOOLS_HIT:-false} |"
            echo "| Go quality tools cache hit | ${GO_TOOLS_HIT:-false} |"
            if [[ -n "${START_EPOCH:-}" ]]; then
              echo "| Mandatory quality duration (seconds) | $(( $(date +%s) - START_EPOCH )) |"
            fi
            echo ''
            echo 'Note: an exact cache miss may still restore from a prefix; inspect cache restore logs for partial hits.'
          } >> "$GITHUB_STEP_SUMMARY"
  platforms:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Cache Rust dependencies and compilation (platforms)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-platforms-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-platforms-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-
            rust-platforms-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release
