[package]
name = "ferrum"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust-native coding agent with Pi/OMP compatibility goals"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
boa_engine = "0.20"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
