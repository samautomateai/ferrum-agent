[package]
name = "ferrum"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust-native coding agent with Pi/OMP compatibility goals"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
boa_engine = "0.22"
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "io-util", "process"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
